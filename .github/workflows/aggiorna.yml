name: Aggiorna dati autovelox
on:
  schedule:
    - cron: "17 2 * * *"      # ogni notte alle 02:17 UTC
  workflow_dispatch: {}        # avvio manuale dalla scheda Actions
permissions:
  contents: write
concurrency: aggiorna-dati
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache confini ISTAT
        uses: actions/cache@v4
        with:
          path: work/istat
          key: istat-v1
      - name: Cache strade OSM (si accumula di notte in notte)
        uses: actions/cache@v4
        with:
          path: work/strade_db.json
          key: strade-${{ github.run_id }}
          restore-keys: strade-
      - run: pip install pyshp shapely pyproj
      - run: bash build.sh
      - name: Pubblica su GitHub Pages (branch gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          force_orphan: true
